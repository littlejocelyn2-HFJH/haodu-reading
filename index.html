<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}

.tab.on{background:var(--blue);color:var(--card)}.tab.done::after{content:" ✓"}
button.go{background:var(--red);color:#fff;border:0;border-radius:999px;padding:9px 22px;font:inherit;cursor:pointer}button.go:disabled{opacity:.4;cursor:not-allowed}
button.alt{background:none;border:2px solid var(--ink);color:var(--ink);border-radius:999px;padding:6px 16px;font:inherit;cursor:pointer}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px}
textarea{min-height:60px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--card))}

table{border-collapse:collapse;font-size:14px;min-width:100%}th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:center;white-space:nowrap}.scroll{overflow-x:auto}

#bs .bar{grid-template-columns:minmax(6em,14em) 1fr 4.5em;font-size:clamp(16px,1.5vw,26px)}
